      <main style="max-width:36rem;margin:4rem auto;padding:1.5rem;font-family:system-ui,sans-serif;color:#26211c;background:#faf7f2;line-height:1.7">
        <h1>粵語道場 Jyut Dojo</h1>
        <p>这是为普通话母语者设计的粤语学习应用。请启用 JavaScript 后继续学习。</p>
        <p>课程从六个声调、粤拼声母和韵母开始，再通过数字、时间、人称等基础词汇，逐步进入打招呼、茶餐厅点餐、问路、购物、坐港铁、看医生、租房和职场等生活情景。</p>
        <p>每课包含「学、练、测」三个环节，并提供跟读录音、听写、错题重练和间隔复习。学习进度默认保存在你的设备上；云端同步属于可选功能。</p>
        <p>如果你使用的是无障碍阅读器，请确认浏览器允许 JavaScript；应用完成加载后会提供清晰的标题、按钮标签和键盘可访问的操作控件。</p>
      </main>
    </noscript>
